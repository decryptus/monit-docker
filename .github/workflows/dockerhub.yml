name: Docker Hub

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui:
    name: Build and test optional UI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker build -t monit-docker-ui:test ui
      - name: Install agent dependencies for proxy integration tests
        run: python -m pip install -r requirements.txt
      - name: Test real Nginx authentication and action proxy
        run: python .github/scripts/check-ui-proxy.py
      - name: Check private Compose wiring
        env:
          UI_ORIGIN: https://localhost:8443
        run: |
          docker compose -f examples/ui/compose.yaml -f examples/ui/compose.journal.yaml config --quiet
          docker compose -f examples/ui/compose.yaml -f examples/ui/compose.actions.yaml config --format json > "$RUNNER_TEMP/ui-compose.json"
          python - "$RUNNER_TEMP/ui-compose.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          assert not c['services']['monit-docker'].get('ports')
          assert c['networks']['agent']['internal']
          assert c['services']['ui']['ports'][0]['host_ip'] == '127.0.0.1'
          assert all(v['target'] != '/var/run/docker.sock' for v in c['services']['ui']['volumes'])
          assert '--allow-actions' in c['services']['monit-docker']['command']
          PY
      - name: Test desktop and mobile browsers
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ui-browser/node_modules/playwright
          UI_SCREENSHOTS: ${{ runner.temp }}/ui-screenshots
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/ui-browser/node_modules/.bin/playwright" install --with-deps chromium
          node ui/tests/browser.cjs
          node ui/tests/journal.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots/
          retention-days: 14
      - name: Save tested UI image
        if: github.event_name == 'push'
        run: docker save monit-docker-ui:test | gzip > "$RUNNER_TEMP/monit-docker-ui-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-ui-image
          path: ${{ runner.temp }}/monit-docker-ui-image.tar.gz
          retention-days: 7

  packages:
    name: Build and test Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel from source distribution and check metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/check-python-distributions.py
      - name: Test the installed wheel outside the source checkout
        env:
          EXPECTED_VERSION: ${{ github.workspace }}/VERSION
        run: |
          python -m venv "$RUNNER_TEMP/pypi-test"
          "$RUNNER_TEMP/pypi-test/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/pypi-tests"
          cp -R tests "$RUNNER_TEMP/pypi-tests/tests"
          cd "$RUNNER_TEMP/pypi-tests"
          "$RUNNER_TEMP/pypi-test/bin/python" -c 'import os; from pathlib import Path; from importlib.metadata import version; import monit_docker; expected = Path(os.environ["EXPECTED_VERSION"]).read_text().strip(); assert monit_docker.__version__ == version("monit-docker") == expected'
          "$RUNNER_TEMP/pypi-test/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/pypi-test/bin/monit-docker" --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release selection
        run: python3 -m unittest discover -s .github/tests -v
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vX.Y.Z'; exit 1; }
          test "${TAG#v}" = "$(cat VERSION)"
          test "${TAG#v}" = "$(cat RELEASE)"
      - uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: monit-docker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the built image
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests:/test/tests:ro" -w /test monit-docker:test -c 'mkdir -p /test/bin; ln -s "$(command -v monit-docker)" /test/bin/monit-docker; python -m unittest discover -s tests -v'
          docker run --rm --entrypoint python -e EXPECTED_VERSION="$(cat VERSION)" monit-docker:test -c 'import os; from importlib.metadata import version; assert version("monit-docker") == os.environ["EXPECTED_VERSION"]'
          docker run --rm --entrypoint monit-docker monit-docker:test --help
      - name: Save tested image
        if: github.event_name == 'push'
        run: docker save monit-docker:test | gzip > "$RUNNER_TEMP/monit-docker-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-image
          path: ${{ runner.temp }}/monit-docker-image.tar.gz
          retention-days: 7

  publish:
    needs: [image, packages, ui]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    concurrency:
      group: monit-docker-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release
        id: release
        shell: bash
        run: bash .github/scripts/select-release.sh
      - name: Check Docker Hub credentials
        if: steps.release.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure the DOCKERHUB_TOKEN repository secret.'; exit 1; }
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Load tested image
        if: steps.release.outputs.publish == 'true'
        run: docker load --input "$RUNNER_TEMP/monit-docker-image.tar.gz"
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: tested-ui-image
          path: ${{ runner.temp }}
      - name: Load tested UI image
        if: steps.release.outputs.publish == 'true'
        run: docker load --input "$RUNNER_TEMP/monit-docker-ui-image.tar.gz"
      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create version tag
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$(git rev-parse HEAD)"
      - name: Publish versioned image
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag monit-docker:test "decryptus/monit-docker:${TAG#v}"
          docker tag monit-docker:test "decryptus/monit-docker:$TAG"
          docker push "decryptus/monit-docker:${TAG#v}"
          docker push "decryptus/monit-docker:$TAG"
          docker tag monit-docker-ui:test "decryptus/monit-docker-ui:${TAG#v}"
          docker tag monit-docker-ui:test "decryptus/monit-docker-ui:$TAG"
          docker push "decryptus/monit-docker-ui:${TAG#v}"
          docker push "decryptus/monit-docker-ui:$TAG"

  pypi:
    name: Publish Python distributions to PyPI
    needs: [packages, publish]
    if: github.event_name == 'push' && needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/monit-docker/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: monit-docker-pypi
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish tested distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
