name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  monitoring-compose:
    name: Compose monitoring end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: monit-compose-ci
      MONIT_COMPOSE_FIXTURE: monit-compose-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the documented stack
        run: |
          docker run -d --name "$MONIT_COMPOSE_FIXTURE" alpine:3.20 sleep 900
          sh examples/monitoring/start.sh
          docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env config --quiet
      - name: Verify collection, Grafana queries, failures and persistent history
        run: python3 .github/scripts/check-monitoring-compose.py
      - name: Inspect failed services
        if: failure()
        run: |
          docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env ps --all
          docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env logs --tail=100
      - name: Clean up disposable test resources
        if: always()
        run: |
          if [ -f examples/monitoring/.env ]; then
            docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env down --volumes --remove-orphans
          fi
          docker rm -f "$MONIT_COMPOSE_FIXTURE" || true

  documentation:
    name: Documentation build and internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html

  monitoring-examples:
    name: Grafana import, PromQL and alert regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dashboard queries
        run: |
          python3 .github/scripts/check-grafana-dashboard.py rules "$RUNNER_TEMP/grafana-rules.json"
          docker run --rm --entrypoint promtool \
            -v "$RUNNER_TEMP/grafana-rules.json:/rules.json:ro" \
            prom/prometheus:v3.5.0 check rules /rules.json
      - name: Validate Prometheus configuration and alert behavior
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/examples/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/examples/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml
      - name: Import dashboard into a disposable Grafana
        run: |
          trap 'docker rm -f monit-grafana >/dev/null 2>&1 || true' EXIT
          docker run -d --name monit-grafana -p 127.0.0.1:3000:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD=monit-ci-only grafana/grafana:12.2.0
          python3 .github/scripts/check-grafana-dashboard.py import

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install setuptools wheel
      - run: python -m unittest discover -s tests -v
      - name: Exercise engine against a real Docker daemon
        if: matrix.python-version == '3.12'
        env:
          MONIT_DOCKER_INTEGRATION: '1'
        run: |
          docker pull alpine:3.20
          python -m unittest discover -s tests -p test_docker_integration.py -v
