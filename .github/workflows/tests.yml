name: Regression tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  textual:
    name: Optional Textual candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: decryptus/dwho
          ref: 50b50eaa9696628e9521a31ae92305e01966e6fa
          path: candidate-dwho
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./candidate-dwho
      - run: python -m pip install '.[textual]'
      - name: Test installed interface outside source checkout
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/textual_tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/textual_tests" -v
      - name: Generate candidate captures from actual interface
        run: PYTHONPATH=. python scripts/capture_textual.py --output "$RUNNER_TEMP/textual-captures"
      - uses: actions/upload-artifact@v4
        with:
          name: textual-candidate-captures
          path: ${{ runner.temp }}/textual-captures
          if-no-files-found: error

  notifications:
    name: Email and Slack notification examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML aiosmtpd==1.4.6
      - name: Validate receiver examples and optional Compose wiring
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: |
          for config in email slack email-slack redis; do
            docker run --rm --entrypoint /bin/amtool \
              -v "$PWD/examples/monitoring:/examples:ro" \
              prom/alertmanager:v0.28.1 check-config "/examples/alertmanager.$config.yml"
          done
          mkdir -m 700 examples/monitoring/notifications.local
          cp examples/monitoring/alertmanager.email-slack.yml examples/monitoring/notifications.local/alertmanager.yml
          touch examples/monitoring/notifications.local/smtp_password examples/monitoring/notifications.local/slack_webhook_url
          docker compose -f examples/monitoring/compose.yaml \
            -f examples/monitoring/compose.notifications.yaml config --format json > "$RUNNER_TEMP/notifications-compose.json"
          python - "$RUNNER_TEMP/notifications-compose.json" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1]))
          prom = config['services']['prometheus']
          mounts = {v['target']: v for v in prom['volumes']}
          assert mounts['/etc/prometheus/prometheus.yml']['source'].endswith('/prometheus-notifications.yml')
          assert '/etc/prometheus/alerts.yml' in mounts
          assert prom['depends_on']['alertmanager']['condition'] == 'service_healthy'
          assert prom['depends_on']['monit-docker']['condition'] == 'service_healthy'
          am = config['services']['alertmanager']
          assert am['ports'][0]['host_ip'] == '127.0.0.1'
          assert {s['source'] for s in am['secrets']} == {'smtp_password', 'slack_webhook_url'}
          assert all(v['target'] != '/var/run/docker.sock' for v in am['volumes'])
          PY
          docker run --rm --entrypoint promtool \
            -v "$PWD/examples/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus-notifications.yml
      - name: Validate source-build audit overlay
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: |
          touch examples/monitoring/notifications.local/audit_token
          docker compose -f examples/monitoring/compose.yaml \
            -f examples/monitoring/compose.notifications.yaml \
            -f examples/monitoring/compose.audit.yaml config --quiet
      - name: Test grouped firing and resolved notifications against local receivers
        run: python .github/scripts/check-notifications.py

  redis-notifications:
    name: Alertmanager to Redis end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: monit-redis-ci
      GRAFANA_ADMIN_PASSWORD: validation-only
      REDIS_STREAM_MAXLEN: '5'
      REDIS_TEST_OVERRIDE: /tmp/monit-redis-test.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable receiver configuration
        run: |
          mkdir -m 700 examples/monitoring/notifications.local
          sed -e 's/group_wait: 30s/group_wait: 1s/' -e 's/group_interval: 5m/group_interval: 2s/' \
            examples/monitoring/alertmanager.redis.yml > examples/monitoring/notifications.local/alertmanager.yml
          printf '%s' 'ci-only-token-0123456789abcdef0123456789abcdef' > examples/monitoring/notifications.local/redis_webhook_token
          printf '%s' 'redis://redis:6379/0' > examples/monitoring/notifications.local/redis_url
          touch examples/monitoring/notifications.local/smtp_password examples/monitoring/notifications.local/slack_webhook_url
          chmod 644 examples/monitoring/notifications.local/*
          printf 'services:\n  redis-webhook:\n    ports: ["127.0.0.1:9080:9080"]\n' > "$REDIS_TEST_OVERRIDE"
      - name: Build and start the documented Redis stack
        run: |
          sh examples/monitoring/start.sh --redis
          docker compose -f examples/monitoring/compose.yaml -f examples/monitoring/compose.notifications.yaml \
            -f examples/monitoring/compose.redis.yaml -f "$REDIS_TEST_OVERRIDE" up -d --wait --wait-timeout 120
      - name: Check receiver contracts in the actual image
        run: |
          docker compose -f examples/monitoring/compose.yaml -f examples/monitoring/compose.notifications.yaml \
            -f examples/monitoring/compose.redis.yaml exec -T redis-webhook python - < .github/scripts/test-redis-webhook.py
      - name: Test DWho HTTP config and template against a local receiver
        run: |
          docker compose -f examples/monitoring/compose.yaml -f examples/monitoring/compose.notifications.yaml \
            -f examples/monitoring/compose.redis.yaml run --rm --no-deps \
            -v "$PWD:/source:ro" redis-webhook python /source/.github/scripts/test-dwho-http.py
      - name: Test delivery, failure recovery and stream persistence
        run: python .github/scripts/check-redis-notifications.py
      - name: Inspect failed services
        if: failure()
        run: |
          docker compose -f examples/monitoring/compose.yaml -f examples/monitoring/compose.notifications.yaml \
            -f examples/monitoring/compose.redis.yaml logs --tail=100
      - name: Remove disposable stack and volumes
        if: always()
        run: |
          docker compose -f examples/monitoring/compose.yaml -f examples/monitoring/compose.notifications.yaml \
            -f examples/monitoring/compose.redis.yaml down --volumes --remove-orphans

  monitoring-compose:
    name: Compose monitoring end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: monit-compose-ci
      MONIT_COMPOSE_FIXTURE: monit-compose-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the documented stack
        run: |
          docker run -d --name "$MONIT_COMPOSE_FIXTURE" alpine:3.20 sleep 900
          sh examples/monitoring/start.sh
          docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env config --quiet
      - name: Verify collection, Grafana queries, failures and persistent history
        run: python3 .github/scripts/check-monitoring-compose.py
      - name: Inspect failed services
        if: failure()
        run: |
          docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env ps --all
          docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env logs --tail=100
      - name: Clean up disposable test resources
        if: always()
        run: |
          if [ -f examples/monitoring/.env ]; then
            docker compose -f examples/monitoring/compose.yaml --env-file examples/monitoring/.env down --volumes --remove-orphans
          fi
          docker rm -f "$MONIT_COMPOSE_FIXTURE" || true

  documentation:
    name: Documentation build and internal references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html

  monitoring-examples:
    name: Grafana import, PromQL and alert regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dashboard queries
        run: |
          python3 .github/scripts/check-grafana-dashboard.py rules "$RUNNER_TEMP/grafana-rules.json"
          docker run --rm --entrypoint promtool \
            -v "$RUNNER_TEMP/grafana-rules.json:/rules.json:ro" \
            prom/prometheus:v3.5.0 check rules /rules.json
      - name: Validate Prometheus configuration and alert behavior
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/examples/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/examples/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/examples/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.runtime.test.yml
      - name: Import dashboard into a disposable Grafana
        run: |
          trap 'docker rm -f monit-grafana >/dev/null 2>&1 || true' EXIT
          docker run -d --name monit-grafana -p 127.0.0.1:3000:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD=monit-ci-only grafana/grafana:12.2.0
          python3 .github/scripts/check-grafana-dashboard.py import

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install setuptools wheel
      - name: Verify test collection
        run: python .github/scripts/check-test-collection.py --runner unittest tests
      - run: python -m unittest discover -s tests -v
      - name: Measure bounded journal reads with 50 MiB of retained history
        if: matrix.python-version == '3.12'
        run: python .github/scripts/benchmark-audit.py
      - name: Measure journal and loopback HTTP resource baselines
        if: matrix.python-version == '3.12'
        run: python .github/scripts/benchmark-baseline.py --output "$RUNNER_TEMP/performance-baseline.json"
      - name: Measure sustained and saturated audit HTTP load
        if: matrix.python-version == '3.12'
        run: python .github/scripts/benchmark-audit-load.py --output "$RUNNER_TEMP/audit-load.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: performance-baseline
          path: |
            ${{ runner.temp }}/performance-baseline.json
            ${{ runner.temp }}/audit-load.json
          retention-days: 30
      - name: Exercise engine against a real Docker daemon
        if: matrix.python-version == '3.12'
        env:
          MONIT_DOCKER_INTEGRATION: '1'
        run: |
          python --version
          docker version
          docker compose version
          docker info --format 'OS={{.OSType}} Architecture={{.Architecture}} CgroupVersion={{.CgroupVersion}}'
          docker pull alpine:3.20
          python -m unittest discover -s tests -p test_access_docker.py -v
          python -m unittest discover -s tests -p test_runtime_docker.py -v
          python -m unittest discover -s tests -p test_docker_integration.py -v

  terminal:
    name: Terminal acceptance (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package: [candidate, published-0.0.82]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected distribution
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python -m venv "$RUNNER_TEMP/terminal-venv"
          if [ "$PACKAGE" = candidate ]; then
            "$RUNNER_TEMP/terminal-venv/bin/pip" install .
          else
            "$RUNNER_TEMP/terminal-venv/bin/pip" install monit-docker==0.0.82
          fi
      - name: Exercise installed CLI and curses against real Docker
        env:
          MONIT_DOCKER_INTEGRATION: '1'
        run: |
          docker pull alpine:3.20
          mkdir -p "$RUNNER_TEMP/terminal-tests"
          cp tests/test_terminal_docker.py "$RUNNER_TEMP/terminal-tests/"
          cd "$RUNNER_TEMP/terminal-tests"
          "$RUNNER_TEMP/terminal-venv/bin/python" -m unittest discover -v

  oom-diagnostics:
    name: Repeated OOM evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: docker pull alpine:3.20
      - name: Exercise six fresh OOM fixtures without retrying assertions
        env:
          MONIT_DOCKER_INTEGRATION: '1'
        run: |
          set -o pipefail
          python - <<'PYTHON' 2>&1 | tee "$RUNNER_TEMP/oom-diagnostics.log"
          import sys, unittest
          sys.path.insert(0, 'tests')
          from test_runtime_docker import RuntimeDockerTests
          suite = unittest.TestSuite(RuntimeDockerTests(
              'test_oom_event_survives_automatic_restart_and_new_agent') for _ in range(6))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oom-diagnostics
          path: ${{ runner.temp }}/oom-diagnostics.log
          retention-days: 14
