# Use after docker-compose.yml with Compose 2.24.4 or newer.
services:
  monit-docker:
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      NO_PROXY: socket-proxy,localhost,127.0.0.1
    # Remove the inherited direct socket mount, keeping the normal state volume.
    volumes: !override
      - state:/var/lib/monit-docker
    networks: [agent, docker-api]
    depends_on: [socket-proxy]

  socket-proxy:
    build: ./examples/socket-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    group_add: ["${DOCKER_SOCKET_GID:?Set DOCKER_SOCKET_GID to the socket group ID}"]
    networks: [docker-api]
    environment:
      EXEC_TARGETS: ${MONIT_PROXY_EXEC_TARGETS:-}
      LIFECYCLE_TARGETS: ${MONIT_PROXY_LIFECYCLE_TARGETS:-}
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false

networks:
  docker-api:
    internal: true
