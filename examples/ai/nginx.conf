# Opt-in server-context include, replacing /etc/nginx/monit-ai.conf in the UI.
# AI operators have their own password file; dashboard access alone is insufficient.
location ~ ^/v1/ai/(preview|explain)$ {
    limit_except POST { deny all; }
    auth_basic "monit-docker AI operators";
    auth_basic_user_file /run/secrets/ai-htpasswd;
    proxy_pass http://monit-docker:9808;
    proxy_connect_timeout 3s;
    proxy_read_timeout 130s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Monit-Actor $remote_user;
    proxy_set_header X-Monit-Action-Token "";
    proxy_set_header X-Monit-Audit-Token "";
    include /run/secrets/proxy-ai.conf;
}
