services:
  monit-docker:
    image: decryptus/monit-docker:0.0.57
    command: [monit-docker, serve, --bind, 0.0.0.0, --interval, '30']
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:${MONIT_DOCKER_PORT:-9808}:9808'
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:9808/readyz", timeout=3).read()']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped
    depends_on:
      monit-docker:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./alerts.yml
        target: /etc/prometheus/alerts.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run sh start.sh or set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/monit-docker.json
    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./grafana/datasources.yml
        target: /etc/grafana/provisioning/datasources/monit-docker.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/dashboards.yml
        target: /etc/grafana/provisioning/dashboards/monit-docker.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../grafana/monit-docker.json
        target: /var/lib/grafana/dashboards/monit-docker.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  prometheus-data:
  grafana-data:
