# Same collection/rules as prometheus.yml, with optional notification delivery.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: monit-docker
    static_configs:
      - targets: ['monit-docker:9808']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
