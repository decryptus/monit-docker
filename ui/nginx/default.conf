limit_req_zone $binary_remote_addr zone=monit_ui:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "monit-docker";
    auth_basic_user_file /run/secrets/htpasswd;
    root /usr/share/nginx/html;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=monit_ui burst=20 nodelay;
    gzip on;
    gzip_types text/css application/javascript;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = / { limit_except GET { deny all; } try_files /index.html =404; }
    location = /logs { limit_except GET { deny all; } try_files /logs.html =404; }
    location = /logs.js { limit_except GET { deny all; } try_files $uri =404; }
    location = /app.js { limit_except GET { deny all; } try_files $uri =404; }
    location = /app.css { limit_except GET { deny all; } try_files $uri =404; }
    location = /v1/status {
        limit_except GET { deny all; }
        include /etc/nginx/monit-proxy.conf;
        proxy_set_header X-Monit-Action-Token "";
    }
    location = /v1/actions {
        limit_except POST { deny all; }
        include /etc/nginx/monit-proxy.conf;
        # This file contains a proxy_set_header directive, never a browser token.
        include /run/secrets/proxy-action.conf;
    }
    location = /v1/audit {
        limit_except GET { deny all; }
        include /etc/nginx/monit-proxy.conf;
        proxy_set_header X-Monit-Action-Token "";
        include /etc/nginx/monit-audit.conf;
    }
    location = /v1/audit/export {
        limit_except GET { deny all; }
        include /etc/nginx/monit-proxy.conf;
        proxy_set_header X-Monit-Action-Token "";
        include /etc/nginx/monit-audit.conf;
    }
    # Metrics and health endpoints stay on the private agent network.
    location / { return 404; }
}
