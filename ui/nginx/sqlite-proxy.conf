proxy_pass http://monit-docker:9808;
proxy_connect_timeout 3s;
proxy_send_timeout 10s;
proxy_set_header Host $http_host;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header X-Monit-Client $http_x_monit_client;
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Monit-Actor "";
proxy_set_header X-Monit-Action-Token "";
proxy_set_header X-Monit-Audit-Token "";
proxy_set_header X-Monit-AI-Token "";
