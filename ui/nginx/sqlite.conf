# Opt-in replacement for default.conf. TLS terminates here; the agent remains private.
limit_req_zone $binary_remote_addr zone=monit_sqlite:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=monit_login:1m rate=2r/s;
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=monit_sqlite burst=20 nodelay;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location = / { limit_except GET { deny all; } try_files /index.html =404; }
    location = /logs { limit_except GET { deny all; } try_files /logs.html =404; }
    location ~ ^/(app\.js|auth\.js|logs\.js|app\.css)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location = /v1/auth/login {
        limit_except POST { deny all; }
        limit_req zone=monit_login burst=5 nodelay;
        include /etc/nginx/monit-sqlite-proxy.conf;
    }
    location ~ ^/v1/(auth/(info|me|logout|sessions|users)|status|actions|audit(/export)?|ai/(preview|explain))$ {
        limit_except GET POST { deny all; }
        include /etc/nginx/monit-sqlite-proxy.conf;
        proxy_read_timeout 130s;
    }
    # Machine metrics/notification traffic uses scoped tokens on the private network.
    location / { return 404; }
}
